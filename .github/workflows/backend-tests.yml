name: Backend tests & schema contract

# NOTE ON LOCATION: the two pre-existing workflows in this repo
# (frontend/.github/workflows/docker.yml, vercel-deploy.yml) live under
# frontend/.github/ instead of the repo root .github/ — GitHub Actions only
# ever reads .github/workflows at the repository root, so those two have
# never actually run. This file is placed correctly; consider moving the
# other two alongside it.

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # These tests hit the real configured database (see
      # backend/tests/conftest.py's module docstring — there is no isolated
      # test-DB fixture in this project yet, matching the pre-existing test
      # suite's own convention). Point DATABASE_URL at a disposable/staging
      # database for CI, not production, until that's addressed.
      DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      SECRET_KEY: ${{ secrets.TEST_SECRET_KEY }}
      DROPBOX_ACCESS_TOKEN: ${{ secrets.TEST_DROPBOX_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run pytest
        run: pytest tests/ -v --cov=app --cov-report=term-missing

      - name: Export OpenAPI schema (for the frontend contract check)
        run: python scripts/export_openapi.py openapi.json

      - uses: actions/upload-artifact@v4
        with:
          name: openapi-schema
          path: backend/openapi.json
          retention-days: 7

  contract-check:
    needs: backend-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: openapi-schema
          path: backend

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Verify Zod <-> Pydantic contract
        working-directory: frontend
        run: npm run verify:contract -- ../backend/openapi.json
