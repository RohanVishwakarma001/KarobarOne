# Alembic configuration file

[alembic]
# Path to migration scripts
script_location = alembic

# Prepend the project root to sys.path so imports work
prepend_sys_path = .

# Template used to generate migration files
# file_template = %%(rev)s_%%(slug)s

# Placeholder — overridden at runtime by env.py from pydantic-settings
sqlalchemy.url = driver://user:pass@localhost/dbname


[post_write_hooks]
# Uncomment to run ruff on generated migration files:
# hooks = ruff
# ruff.type = exec
# ruff.executable = ruff
# ruff.options = format REVISION_SCRIPT_FILENAME


# ──────────────────────────────────────
# Logging configuration
# ──────────────────────────────────────

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
